name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AcmHouse.Api.sln

      - name: Build
        run: dotnet build AcmHouse.Api.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AcmHouse.Api.sln --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Report test count
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          total = passed = failed = 0
          for f in glob.glob("TestResults/*.trx"):
              c = ET.parse(f).getroot().find("t:ResultSummary/t:Counters", ns).attrib
              total += int(c["total"]); passed += int(c["passed"]); failed += int(c["failed"])
          print(f"::notice title=Tests::total={total} passed={passed} failed={failed}")
          if total == 0:
              print("::error::No tests were discovered"); sys.exit(1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
